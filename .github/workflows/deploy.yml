name: 🚀 Deploy workwii
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.1.3 }
      - uses: actions/setup-node@v4
        with: { node-version: '22.14.0', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

      # 🐙 GitHub Pages: Solo se publicara para diseños, 
      - name: 🐙 GitHub Pages
        env:
          PUBLIC_BASE: ${{ github.ref_type == 'tag' && format('/workwii/{0}/', github.ref_name) || '/workwii/' }}
        run: pnpm build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ github.ref_type == 'tag' && github.ref_name || '.' }}
          keep_files: true